name: NEXUS Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "index.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "www/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "index.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "www/**"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NEXUS Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Capacitor configuration
        run: npx cap doctor

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync web application
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
