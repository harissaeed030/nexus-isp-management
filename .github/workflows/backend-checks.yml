name: Nexus backend checks

on:
  push:
    branches:
      - build/nexus-isp-core
  pull_request:
    branches:
      - build/nexus-isp-core

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
