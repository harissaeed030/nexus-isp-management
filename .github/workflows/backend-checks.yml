name: Nexus backend checks

on:
  push:
    branches:
      - build/nexus-isp-core
  pull_request:
    branches:
      - main
      - build/nexus-isp-core

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        working-directory: backend
      - run: npm run verify
        working-directory: backend
      - run: node --check ../assets/js/app.js
        working-directory: backend
