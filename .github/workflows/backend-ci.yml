name: Nexus Backend CI

on:
  push:
    branches:
      - dev
      - build/nexus-isp-core
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run syntax checks and smoke tests
        working-directory: backend
        run: npm run verify
