name: NEXUS backend verification

on:
  push:
    branches:
      - build/nexus-isp-core
  pull_request:
    branches:
      - main
      - build/nexus-isp-core

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Run syntax and test suite
        working-directory: backend
        run: npm run verify
