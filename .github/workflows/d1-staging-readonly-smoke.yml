name: NEXUS staging read-only smoke tests

on:
  workflow_dispatch:

jobs:
  staging-readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live staging API without writing test data
        env:
          NEXUS_STAGING_API_URL: https://nexus-saas-api-staging.harissaeed030.workers.dev
        run: node worker/scripts/d1-staging-readonly-smoke.mjs
