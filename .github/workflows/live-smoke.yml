name: NEXUS live smoke verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
      - "worker/**"
      - "index.html"
      - "assets/**"
      - "portal/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
      - "worker/**"
      - "index.html"
      - "assets/**"
      - "portal/**"
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    name: Verify production and staging endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production and staging Workers
        env:
          PRODUCTION_API: https://nexus-saas-api.harissaeed030.workers.dev
          STAGING_API: https://nexus-saas-api-staging.harissaeed030.workers.dev
          FRONTEND_URL: https://nexus-isp-management.pages.dev
          REQUIRE_PRODUCTION_PORTAL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const origin = process.env.FRONTEND_URL;
          const targets = [
            ["production", process.env.PRODUCTION_API],
            ["staging", process.env.STAGING_API],
          ];

          for (const [environment, base] of targets) {
            const healthResponse = await fetch(base + "/api/health", {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(healthResponse.status, 200, environment + " health status");
            const health = await healthResponse.json();
            assert.equal(health.status, "healthy", environment + " Worker health");
            assert.equal(health.database, "ok", environment + " D1 connectivity");

            const preflight = await fetch(base + "/api/dashboard/stats", {
              method: "OPTIONS",
              headers: {
                Origin: origin,
                "Access-Control-Request-Method": "GET",
                "Access-Control-Request-Headers": "authorization",
              },
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(preflight.status, 204, environment + " CORS preflight");
            assert.equal(
              preflight.headers.get("access-control-allow-origin"),
              origin,
              environment + " CORS origin",
            );

            const protectedResponse = await fetch(base + "/api/dashboard/stats", {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(protectedResponse.status, 401, environment + " unauthenticated API guard");

            const tenantGuard = await fetch(base + "/api/tenant", {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(tenantGuard.status, 401, environment + " unauthenticated tenant-settings guard");

            for (const header of [
              "x-content-type-options",
              "x-frame-options",
              "referrer-policy",
              "strict-transport-security",
            ]) {
              assert.ok(
                healthResponse.headers.get(header),
                environment + " missing security header: " + header,
              );
            }

            if (environment !== "production" || process.env.REQUIRE_PRODUCTION_PORTAL === "true") {
              const portalGuard = await fetch(base + "/api/portal/me", {
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(15000),
              });
              assert.equal(portalGuard.status, 401, environment + " customer portal auth guard");
            }

            console.log(environment + ": health, D1, CORS, auth guard and security headers passed");
          }

          const page = await fetch(origin, { signal: AbortSignal.timeout(15000) });
          assert.equal(page.status, 200, "Pages production status");
          assert.match(page.headers.get("content-type") || "", /text\/html/i);
          const html = await page.text();
          assert.match(html, /NEXUS/i, "Pages frontend content");
          console.log("Pages production: HTTP 200 and NEXUS HTML verified");

          const portalPage = await fetch(origin + "/portal/", { signal: AbortSignal.timeout(15000) });
          assert.equal(portalPage.status, 200, "Customer portal page status");
          assert.match(await portalPage.text(), /NEXUS|Customer Portal/i, "Customer portal HTML");
          console.log("Pages customer portal: HTTP 200 and portal HTML verified");
          NODE
