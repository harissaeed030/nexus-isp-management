name: Network safety and adapter contract

on:
  pull_request:
    paths:
      - "backend/src/lib/network-write-guard.js"
      - "backend/src/services/network-adapter-contract.js"
      - "backend/scripts/network-write-guard.test.js"
      - "backend/scripts/network-adapter-contract.test.js"
      - "backend/src/services/mikrotik-readonly-adapter.js"
      - "backend/scripts/mikrotik-readonly-adapter.test.js"
      - "backend/src/routes/mikrotik.routes.js"
      - "worker/src/index.js"
      - "worker/src/network-connector-contract.js"
      - "worker/scripts/network-connector-contract.test.js"
      - "backend/src/services/network-connector-agent.js"
      - "backend/scripts/network-connector-agent.test.js"
      - "backend/src/app.js"
      - "backend/package.json"
      - ".github/workflows/network-safety.yml"
  push:
    branches:
      - "feat/network-automation-foundation"
    paths:
      - "backend/src/lib/network-write-guard.js"
      - "backend/src/services/network-adapter-contract.js"
      - "backend/scripts/network-write-guard.test.js"
      - "backend/scripts/network-adapter-contract.test.js"
      - "backend/src/app.js"
      - "backend/package.json"
      - ".github/workflows/network-safety.yml"

permissions:
  contents: read

jobs:
  network-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install backend dependencies for agent tests
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Syntax-check network safety modules
        working-directory: backend
        run: |
          node --check src/app.js
          node --check src/services/network-connector-agent.js
          node --check scripts/network-connector-agent.test.js
          node --check src/services/mikrotik-readonly-adapter.js
          node --check scripts/mikrotik-readonly-adapter.test.js
          node --check src/lib/network-write-guard.js
          node --check src/services/network-adapter-contract.js
          node --check scripts/network-write-guard.test.js
          node --check scripts/network-adapter-contract.test.js
      - name: Run MikroTik read-only adapter tests
        working-directory: backend
        run: node --test scripts/mikrotik-readonly-adapter.test.js
      - name: Run private connector agent tests
        working-directory: backend
        run: node --test scripts/network-connector-agent.test.js
      - name: Run network write gate tests
        working-directory: backend
        run: node --test scripts/network-write-guard.test.js
      - name: Run adapter contract tests
        working-directory: backend
        run: node --test scripts/network-adapter-contract.test.js

      - name: Run full local backend verification
        working-directory: backend
        run: npm run verify
      - name: Syntax-check hosted connector Worker
        run: |
          node --check worker/src/index.js
          node --check worker/src/network-connector-contract.js
          node --check worker/scripts/network-connector-contract.test.js
      - name: Run hosted connector contract tests
        run: node --test worker/scripts/network-connector-contract.test.js
