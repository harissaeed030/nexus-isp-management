name: NEXUS local Worker password-hash benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Compare PBKDF2 candidates in local workerd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run isolated local workerd benchmark
        run: node worker/benchmarks/run-password-hash-benchmark.mjs
