name: NEXUS D1 password reset contract

on:
  push:
    branches: [work/password-reset-d1-compat]
    paths:
      - "worker/src/d1-api-worker.js"
      - "worker/scripts/password-reset-contract.test.js"
      - "worker/scripts/tenant-settings-contract.test.js"
      - "worker/scripts/d1-api-contract.test.js"
      - "assets/js/app.js"
      - "cloudflare/d1/migrations/0022_password_reset_tokens.sql"
      - ".github/workflows/password-reset-contract.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker/src/d1-api-worker.js
      - name: Run D1 API and password reset contract tests
        run: node --test worker/scripts/d1-api-contract.test.js worker/scripts/password-reset-contract.test.js worker/scripts/tenant-settings-contract.test.js
