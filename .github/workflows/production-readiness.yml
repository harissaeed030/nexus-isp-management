name: NEXUS Production Readiness

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - main
      - dev
      - build/nexus-isp-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Verify syntax, smoke, tenant isolation and security headers
        run: npm run verify
