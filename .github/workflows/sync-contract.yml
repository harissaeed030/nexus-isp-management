name: SQLite-D1 sync contract
on:
  pull_request:
    paths:
      - "shared/sync-contract/**"
      - "backend/src/services/sync-outbox.js"
      - "backend/migrations/011_sqlite_sync_outbox.sql"
      - "backend/scripts/sync-outbox.test.js"
      - "backend/package.json"
      - ".github/workflows/sync-contract.yml"
  push:
    branches: ["feat/sqlite-d1-sync-contract-v1"]
    paths:
      - "shared/sync-contract/**"
      - ".github/workflows/sync-contract.yml"
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test shared/sync-contract/v1.test.js
