name: Worker checks

on:
  push:
  pull_request:
    branches: [dev]

jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check assets/js/app.js
          node --check assets/js/customer-portal.js
