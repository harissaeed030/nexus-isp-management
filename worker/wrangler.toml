# Development-only health-check Worker.
# This configuration is deliberately isolated from the hosted NEXUS API and D1 databases.
# Use worker/wrangler.api.toml for the dedicated staging API only after reviewing its bindings.
# Production deployments must use the separately reviewed production release configuration.
name = "nexus-healthcheck-dev"
main = "src/index.js"
compatibility_date = "2026-11-02"

[vars]
ENVIRONMENT = "development"
